name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Run tests
      run: ./gradlew test --stacktrace
      
    - name: Run lint
      run: ./gradlew lint --stacktrace
      
    - name: Verify APK exists
      run: |
        set -euo pipefail
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "ERROR: APK not found at $APK_PATH"
          exit 1
        fi
        APK_SIZE=$(stat -c%s "$APK_PATH")
        if [ "$APK_SIZE" -lt 100000 ]; then
          echo "ERROR: APK suspiciously small: $APK_SIZE bytes"
          exit 1
        fi
        echo "APK found: $APK_SIZE bytes"
        
    - name: Verify application ID
      run: |
        set -euo pipefail
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort | tail -1)
        APP_ID=$("$AAPT" dump badging "$APK_PATH" | grep "package: name=" | sed "s/.*name='\([^']*\)'.*/\1/")
        echo "Application ID: $APP_ID"
        if [ "$APP_ID" != "com.android.smshero" ]; then
          echo "ERROR: Expected com.android.smshero, got $APP_ID"
          exit 1
        fi
        
    - name: Verify APK signature
      run: |
        set -euo pipefail
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
        "$APKSIGNER" verify --verbose "$APK_PATH"
        
    - name: Calculate SHA-256
      run: |
        set -euo pipefail
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        sha256sum "$APK_PATH" | tee app-debug.apk.sha256
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: smshero-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app-debug.apk.sha256
        retention-days: 30
